# Site de apoio — Arquitetura de Objetos
# Para publicar em outro usuário ou repositório, ajuste a linha site_url.
# O formato é https://USUARIO.github.io/NOME-DO-REPOSITORIO/
site_name: Arquitetura de Objetos
site_url: https://lukenthexplorer.github.io/arquitetura-objetos-site/

site_description: Roteiros de estudo para acompanhar os códigos das aulas de Arquitetura de Objetos.
copyright: Material de apoio à disciplina do Prof. Eduardo Felipe Zambom Santana. Proposta em revisão, ainda não validada por ele.

docs_dir: docs
site_dir: site

theme:
  name: material
  language: pt-BR
  font:
    text: Open Sans
    code: Fira Mono
  palette:
    scheme: default
    primary: white
    accent: indigo
  features:
    - navigation.footer      # links "Anterior" e "Próximo"
    - navigation.top         # botão "voltar ao topo"
    - toc.integrate          # sumário da página dentro do menu, como na referência
    - content.code.copy
    - search.highlight
    - search.suggest

extra_css:
  - assets/css/extra.css

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

# Uma aula só entra no menu quando o roteiro está pronto.
# A lista de aulas da página inicial fica em docs/index.md.
